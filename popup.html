<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instagram Focus</title>
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
    }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p  { font-size: 12px; margin: 0 0 10px; color: #555; line-height: 1.4; }
    ul { font-size: 12px; padding-left: 18px; margin: 0; color: #333; }
    li { margin-bottom: 4px; }
    .ok { color: #1a7f37; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Instagram Focus <span class="ok">ON</span></h1>
  <p>Reels and Explore are blocked on instagram.com.</p>
  <ul>
    <li>Home feed: allowed</li>
    <li>Messages (DMs): allowed</li>
    <li>Profiles &amp; posts: allowed</li>
    <li>Reels: blocked</li>
    <li>Explore: blocked</li>
  </ul>
</body>
</html>
